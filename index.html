<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Login — New Age Professional Services</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand">NEW AGE PROFESSIONAL SERVICES</div>
    <h1>Agent Login</h1>
    <p class="muted">Acceso privado para agentes del equipo.</p>
    <div id="aviso-demo" class="aviso" style="display:none">
      Modo vista previa: usa cualquier correo y contraseña para entrar.<br>
      Con <b>admin@demo.com</b> entras como administrador.
    </div>
    <form id="form-login">
      <label>Correo electrónico
        <input type="email" id="email" required autocomplete="username" placeholder="tu@correo.com">
      </label>
      <label>Contraseña
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <div id="error" class="error" style="display:none"></div>
      <button type="submit" class="btn-dorado" id="btn-entrar">Entrar</button>
    </form>
    <p class="muted small">Si eres agente y no tienes cuenta, pídele tu enlace de invitación a tu director.</p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
  if (MODO_DEMO) document.getElementById('aviso-demo').style.display = 'block';
  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-entrar');
    const err = document.getElementById('error');
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Entrando…';
    try {
      await entrar(
        document.getElementById('email').value.trim(),
        document.getElementById('password').value
      );
      window.location.href = 'panel.html';
    } catch (ex) {
      err.textContent = ex.message || 'No se pudo iniciar sesión.';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
