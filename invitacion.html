<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear tu cuenta — New Age Professional Services</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand">NEW AGE PROFESSIONAL SERVICES</div>
    <h1 id="titulo">Crear tu cuenta</h1>
    <p class="muted" id="subtitulo">Verificando tu invitación…</p>
    <div id="aviso-demo" class="aviso" style="display:none">Modo vista previa.</div>
    <form id="form-invitacion" style="display:none">
      <label>Crea tu contraseña
        <input type="password" id="password" required autocomplete="new-password" placeholder="Mínimo 6 caracteres">
      </label>
      <label>Repite tu contraseña
        <input type="password" id="password2" required autocomplete="new-password" placeholder="••••••••">
      </label>
      <div id="error" class="error" style="display:none"></div>
      <button type="submit" class="btn-dorado" id="btn-crear">Crear cuenta y entrar</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
  (async () => {
    if (MODO_DEMO) document.getElementById('aviso-demo').style.display = 'block';
    const token = new URLSearchParams(window.location.search).get('t');
    const sub = document.getElementById('subtitulo');
    if (!token) { sub.textContent = 'Enlace de invitación inválido.'; return; }
    let inv = null;
    try { inv = await validarInvitacion(token); } catch (e) { inv = null; }
    if (!inv) { sub.textContent = 'Esta invitación no existe o ya fue utilizada.'; return; }
    document.getElementById('titulo').textContent = 'Hola, ' + inv.nombre;
    sub.textContent = 'Crea tu contraseña para entrar al portal como ' + inv.rol + '.';
    document.getElementById('form-invitacion').style.display = 'block';

    document.getElementById('form-invitacion').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-crear');
      const err = document.getElementById('error');
      err.style.display = 'none';
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password2').value;
      if (p1 !== p2) { err.textContent = 'Las contraseñas no coinciden.'; err.style.display = 'block'; return; }
      btn.disabled = true; btn.textContent = 'Creando…';
      try {
        await aceptarInvitacion(token, p1);
        window.location.href = 'panel.html';
      } catch (ex) {
        err.textContent = ex.message || 'No se pudo crear tu cuenta.';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Crear cuenta y entrar';
      }
    });
  })();
</script>
</body>
</html>
